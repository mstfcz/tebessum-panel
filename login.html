        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Yönetim Portalı</h2>

    <!-- Hata Bildirimi -->
    <div id="loginError" class="hidden p-3.5 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl font-medium text-center"></div>

    <!-- Giriş Formu -->
    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">E-Posta Adresi</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="email" id="emailInput" required placeholder="ornek@tebessum.org.tr" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Şifre</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white transition">
        </div>
      </div>

      <button id="loginBtn" type="submit" class="w-full py-3 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl transition shadow-lg shadow-brand-700/20 text-sm flex items-center justify-center gap-2">
        <span>Giriş Yap</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="text-center pt-2">
      <p class="text-[11px] text-slate-400">© 2026 Tebessüm Derneği Bilgi İşlem Birimi</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://hmlhyhisdulbttsyzsvp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_NFS-iNYCga_9Nhc4yTElBA_9j7oU1An";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Zaten giriş yapılmışsa doğrudan panele yönlendir
    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.replace("index.html");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Doğrulanıyor...</span>`;
      err.classList.add('hidden');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        err.innerText = "Giriş başarısız: E-posta veya şifreniz hatalı!";
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span>Giriş Yap</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      } else {
        // Başarılı giriş -> Doğrudan ana yönetim paneline yönlendir
        window.location.replace("index.html");
      }
    }

    window.addEventListener('DOMContentLoaded', checkExistingSession);
  </script>
