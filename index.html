    // ================= CANLI SERVİSLER =================
    let userCoords = { lat: 41.0082, lon: 28.9784, city: "İstanbul" };
    function initUserLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            userCoords.lat = pos.coords.latitude;
            userCoords.lon = pos.coords.longitude;
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userCoords.lat}&lon=${userCoords.lon}`);
              const data = await res.json();
              const district = data.address.province || data.address.city || "İstanbul";
              userCoords.city = district;
              if (document.getElementById('userLocationDisplay')) document.getElementById('userLocationDisplay').innerText = district + ", Türkiye";
            } catch(e) {}
            loadPrayerTimes();
            loadWeather();
          },
          () => { loadPrayerTimes(); loadWeather(); },
          { timeout: 5000 }
        );
      } else { loadPrayerTimes(); loadWeather(); }
    }

    async function loadPrayerTimes() {
      try {
        const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(userCoords.city)}&country=Turkey&method=13`);
        const json = await res.json();
        if (json.data && json.data.timings) {
          const t = json.data.timings;
          if (document.getElementById('pray_imsak')) {
            document.getElementById('pray_imsak').innerText = t.Imsak;
            document.getElementById('pray_sunrise').innerText = t.Sunrise;
            document.getElementById('pray_dhuhr').innerText = t.Dhuhr;
            document.getElementById('pray_asr').innerText = t.Asr;
            document.getElementById('pray_maghrib').innerText = t.Maghrib;
            document.getElementById('pray_isha').innerText = t.Isha;
            highlightCurrentPrayer(t);
          }
        }
      } catch(e) {}
    }

    function timeToMinutes(tStr) { const [h, m] = tStr.split(':').map(Number); return h * 60 + m; }
    function highlightCurrentPrayer(timings) {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const imsak = timeToMinutes(timings.Imsak);
      const sun = timeToMinutes(timings.Sunrise);
      const dhuhr = timeToMinutes(timings.Dhuhr);
      const asr = timeToMinutes(timings.Asr);
      const maghrib = timeToMinutes(timings.Maghrib);
      const isha = timeToMinutes(timings.Isha);

      let activeId = "box_isha";
      if (currentMin >= imsak && currentMin < sun) activeId = "box_imsak";
      else if (currentMin >= sun && currentMin < dhuhr) activeId = "box_sunrise";
      else if (currentMin >= dhuhr && currentMin < asr) activeId = "box_dhuhr";
      else if (currentMin >= asr && currentMin < maghrib) activeId = "box_asr";
      else if (currentMin >= maghrib && currentMin < isha) activeId = "box_maghrib";

      ['box_imsak', 'box_sunrise', 'box_dhuhr', 'box_asr', 'box_maghrib', 'box_isha'].forEach(b => {
        const el = document.getElementById(b);
        if (el) {
          if (b === activeId) {
            el.className = "bg-brand-50 dark:bg-brand-950/70 border border-brand-300 dark:border-brand-600 p-1.5 rounded-lg shadow-sm";
            el.querySelector('span:last-child').className = "font-extrabold text-brand-700 dark:text-sky-300 text-[11px]";
          } else {
            el.className = "bg-slate-50 dark:bg-slate-800/50 p-1.5 rounded-lg border border-transparent";
            el.querySelector('span:last-child').className = "font-bold text-slate-800 dark:text-white text-[11px]";
          }
        }
      });
    }

    async function loadCurrencyAndGold() {
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        const json = await res.json();
        if (json.rates && json.rates.TRY && document.getElementById('curr_usd')) {
          const usd = json.rates.TRY;
          const eur = usd / json.rates.EUR;
          document.getElementById('curr_usd').innerText = "₺" + usd.toFixed(2);
          document.getElementById('curr_eur').innerText = "₺" + eur.toFixed(2);
          document.getElementById('curr_gold').innerText = "₺" + Number(((2658 / 31.1034768) * usd).toFixed(0)).toLocaleString('tr-TR');
        }
      } catch(e) {}
    }

    async function loadWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
        const json = await res.json();
        if (json.current_weather && document.getElementById('weather_temp')) {
          const cw = json.current_weather;
          document.getElementById('weather_temp').innerText = Math.round(cw.temperature) + "°C";
          document.getElementById('weather_desc').innerText = cw.weathercode >= 51 ? "Yağmurlu" : "Açık & Güneşli";
        }
      } catch(e) {}
    }

    async function loadEarthquakes() {
      try {
        const res = await fetch("https://api.orhanaydogdu.com.tr/deprem/kandilli/live?limit=10");
        const json = await res.json();
        const list = document.getElementById('earthquake_list');
        if (json.result && list) {
          list.innerHTML = '';
          json.result.forEach(eq => {
            const div = document.createElement('div');
            div.className = "flex justify-between items-center py-1 border-b border-slate-100 dark:border-slate-800/60";
            div.innerHTML = `<span class="truncate max-w-[140px] text-slate-700 dark:text-slate-300">${eq.title}</span><span class="px-1.5 py-0.5 rounded font-bold text-[10px] bg-slate-100 dark:bg-slate-800">M ${eq.mag.toFixed(1)}</span>`;
            list.appendChild(div);
          });
        }
      } catch(e) {}
    }

    async function loadAaNews() {
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.aa.com.tr/tr/rss/default?cat=guncel')}`);
        const data = await res.json();
        const container = document.getElementById('aaNewsContainer');
        if (data.items && container) {
          container.innerHTML = '';
          data.items.slice(0, 15).forEach(item => {
            const div = document.createElement('div');
            div.className = "p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 transition border border-slate-100 dark:border-slate-800 flex items-center justify-between";
            div.innerHTML = `<a href="${item.link}" target="_blank" class="truncate text-slate-800 dark:text-slate-200 font-semibold hover:text-brand-600">${item.title}</a>`;
            container.appendChild(div);
          });
        }
      } catch(e) {}
    }

    async function askGeminiAi() {
      const prompt = document.getElementById('aiPromptInput').value.trim();
      if (!prompt) return;
      let key = localStorage.getItem('tebessum_gemini_key');
      if (!key) {
        key = prompt("Lütfen Gemini API anahtarınızı giriniz:");
        if (key) localStorage.setItem('tebessum_gemini_key', key.trim());
      }
      const resContainer = document.getElementById('aiResponseContainer');
      resContainer.classList.remove('hidden');
      resContainer.innerText = "Yapay zeka yanıt hazırlıyor...";
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Tebessüm Derneği asistanı olarak cevapla: " + prompt }] }] })
        });
        const data = await res.json();
        resContainer.innerText = data.candidates[0].content.parts[0].text;
      } catch(e) { resContainer.innerText = "Hata oluştu."; }
    }

    // ================= MENÜ & TEMA =================
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('tebessum_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    function initTheme() {
      if (localStorage.getItem('tebessum_theme') === 'dark') document.documentElement.classList.add('dark');
    }

    let isSidebarCollapsed = false;
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const mainWrapper = document.getElementById('mainWrapper');
      const logoFull = document.getElementById('sidebarLogoFull');
      const logoMini = document.getElementById('sidebarLogoMini');
      const textElements = document.querySelectorAll('.sidebar-text');
      const isMobile = window.innerWidth < 1024;

      if (isMobile) {
        sidebar.classList.toggle('-translate-x-full');
        backdrop.classList.toggle('hidden');
      } else {
        isSidebarCollapsed = !isSidebarCollapsed;
        sidebar.classList.toggle('w-64', !isSidebarCollapsed);
        sidebar.classList.toggle('w-20', isSidebarCollapsed);
        mainWrapper.classList.toggle('lg:pl-64', !isSidebarCollapsed);
        mainWrapper.classList.toggle('lg:pl-20', isSidebarCollapsed);
        logoFull.classList.toggle('hidden', isSidebarCollapsed);
        logoMini.classList.toggle('hidden', !isSidebarCollapsed);
        textElements.forEach(el => el.classList.toggle('hidden', isSidebarCollapsed));
      }
    }

    function updateClockAndDate() {
      const now = new Date();
      document.getElementById('realtimeClock').innerText = now.toLocaleTimeString('tr-TR');
      document.getElementById('realtimeDate').innerText = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    function loadSavedProfile(email) {
      const savedName = localStorage.getItem('tebessum_user_name') || 'Mustafa Cengiz';
      document.getElementById('profileDisplayName').innerText = savedName;
      document.getElementById('userEmailShort').innerText = savedName;
    }

    window.addEventListener('DOMContentLoaded', enforceAuth);
  </script>
</body>
